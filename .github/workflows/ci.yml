name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ase-devops-lab .
      - name: Show image size
        run: docker image ls ase-devops-lab
      - name: Run tests inside the container
        run: docker run --rm ase-devops-lab
      - name: Start the API in the background
        run: docker run -d --name api -p 8000:8000 ase-devops-lab uvicorn app.main:app --host 0.0.0.0 --port 8000
      - name: Wait for the API answers
        run:  |
          for i in $(seq 1 20); do
            if curl -s http://localhost:8000/docs > /dev/null; then
              echo "API is up after about $i seconds"
              exit 0
            fi
            sleep 1
          done
          echo "API did not answer within 20 seconds"
          exit 1
      - name: "Smoke test 1: a good price"
        run: |
          response=$(curl -s --fail "http://localhost:8000/price?text=%2450.99")
          echo "$response"
          echo " $response" | grep -q '"price":50.99'
      - name: "Smoke test 2: text that is not a price"
        run: | 
          code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8000/price?text=abc")
          echo "status code: $code"
          test "$code" = "400"
      - name: Show the API logs
        if: always()
        run: docker logs api

      - name: Stop the API
        if: always()
        run: docker stop api
      
  push-ecr:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: ase-devops-lab
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to AWS with the IAM user's keys
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCES_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and tag the image
        run: docker build -t ${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }} .

      - name: Push the image to ECR
        run: docker push ${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}

      - name: Show the size ECR stored
        run: |
          aws ecr describe-images --repository-name $ECR_REPOSITORY \
            --image-ids imageTag=${{ github.sha }} \
            --query 'imageDetails[0].imageSizeInBytes'